{% extends 'base.html' %}

{% block title %}Reset Password — MealMate{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white border-0 pt-4 pb-2 text-center">
                    <span class="fs-1">🔑</span>
                    <h3 class="fw-bold text-dark mt-2 mb-1">Forgot Password?</h3>
                    <p class="text-muted small">Enter your email and we'll send you recovery instructions.</p>
                </div>
                <div class="card-body p-4 pt-2">
                    <form method="POST" action="{% url 'accounts:forgot_password' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Registered Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 mb-3">
                            Send Reset Link
                        </button>
                    </form>
                    <div class="text-center">
                        <a href="{% url 'accounts:login' %}" class="small fw-semibold text-primary text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
